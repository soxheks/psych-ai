{% load static %}
<button class="sound-toggle" type="button" data-sound-toggle aria-label="关闭界面音效" title="关闭界面音效" aria-pressed="true" hidden>
    <img class="effects-on" src="{% static 'core/icons/volume-2.svg' %}" alt="" width="18" height="18">
    <img class="effects-off" src="{% static 'core/icons/volume-x.svg' %}" alt="" width="18" height="18" hidden>
</button>
